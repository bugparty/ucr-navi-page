<footer class="main-footer footer-type-1 text-xs">
            <div id="footer-tools" class="d-flex flex-column">
                <a href="javascript:" id="go-to-up" class="btn rounded-circle go-up m-1" rel="go-top">
                    <i class="iconfont icon-to-up"></i>
                </a>
                <!-- Bottom right corner search  -->
                <a href="javascript:" data-toggle="modal" data-target="#search-modal" class="btn rounded-circle m-1"
                    rel="search" one-link-mark="yes">
                    <i class="iconfont icon-search"></i>
                </a>
                <a href="https://www.yuque.com/shenweiyan" class="btn rounded-circle kefu m-1" target="_blank" data-toggle="tooltip" data-placement="left" title="联系我们">
                    <i class="mode-ico iconfont icon-qq"></i>
                </a>
                <!-- Bottom right corner search end -->
                {{ if $.Site.Params.nightMode }} 
                <a href="javascript:" onclick="window.location.href='javascript:switchNightMode()'" class="btn rounded-circle switch-dark-mode m-1" id="yejian"
                    data-toggle="tooltip" data-placement="left" title="{{ i18n "night_mode" }}">
                    <i class="mode-ico iconfont icon-light"></i>
                </a>
		{{ else }}
		<a href="javascript:" onclick="window.location.href='javascript:switchNightMode()'" class="btn rounded-circle switch-dark-mode m-1" id="yejian"
                    data-toggle="tooltip" data-placement="left" title="{{ i18n "day_mode" }}">
                    <i class="mode-ico iconfont icon-night"></i>
                </a>
                {{ end }}
            </div>
            <div class="footer-inner">
                <div class="footer-text">{{ replace $.Site.Params.footer.copyright "{year}" now.Year | markdownify }}</div>
            </div>
        </footer>
<!-- Bottom right corner search -->
<div class="search-dialog" id="local-search" style="display: none;">
    <div id="local-search-title" class="local-search-title">Search Content</div>
    <div id="local-search-input-wrapper">
        <input id="local-search-input" type="text" name="search" placeholder="Please enter search keywords..." autocomplete="off"/>
    </div>
    <hr>
    <div id="local-search-results-wrapper">
        <div id="local-search-results"></div>
    </div>
</div>
<!-- Bottom right corner search dialog box end -->
<div id="search-mask" style="display: none;"></div>
    </div><!-- main-content end -->
</div><!-- page-container end -->
